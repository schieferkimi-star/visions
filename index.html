<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E2A2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Visions">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Visions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cinzel:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0E2A2C; --curtain:#153A3C; --curtain-2:#1E4C4E;
    --gold:#E8CE7B; --gold-light:#F5E6A8;
    --starlight:#F2F6F4; --starlight-dim:#A9C4C2;
    --amethyst:#5FC2B8; --rose:#2F8F86; --danger:#E27878;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 20% 0%, rgba(95,194,184,0.15), transparent 55%),
      radial-gradient(ellipse at 85% 15%, rgba(232,206,123,0.10), transparent 50%), var(--void);
    color:var(--starlight); font-family:'Cormorant Garamond',serif; min-height:100vh; padding-bottom:3rem;
  }
  .sans{font-family:'Jost',sans-serif;}
  .wrap{max-width:560px; margin:0 auto; padding:0 20px;}
  header{text-align:center; padding:34px 20px 14px;}
  .wordmark{font-family:'Cinzel',serif; font-weight:600; font-size:26px; letter-spacing:0.16em; color:var(--gold-light); margin:0; text-transform:uppercase;}
  .glyph-row{color:var(--amethyst); font-size:13px; letter-spacing:0.3em; margin:8px 0 12px;}
  .rule{height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto 6px; width:70%;}
  .tagline{font-style:italic; color:var(--starlight-dim); font-size:15px; margin:0;}

  nav{display:flex; justify-content:center; gap:2px; margin:22px 0 0; border-bottom:1px solid rgba(232,206,123,0.25);}
  .tab{font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.1em; text-transform:uppercase; background:none; border:none; color:var(--starlight-dim); padding:11px 14px; cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--gold-light); border-bottom-color:var(--gold);}
  .tab:hover{color:var(--starlight);}
  section{display:none; padding-top:22px;}
  section.active{display:block;}
  .empty{text-align:center; color:var(--starlight-dim); font-style:italic; padding:32px 16px; border:1px dashed rgba(232,206,123,0.3); border-radius:4px;}

  .section-head{font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin:26px 0 10px; display:flex; align-items:center; gap:10px;}
  .section-head:after{content:""; flex:1; height:1px; background:rgba(232,206,123,0.3);}

  .card{background:linear-gradient(160deg,var(--curtain-2),var(--curtain)); border:1px solid rgba(232,206,123,0.3); border-left:3px solid var(--gold); border-radius:6px; padding:14px 16px; margin-bottom:12px;}
  .card h3{margin:0 0 4px; font-size:19px; font-weight:600; color:var(--starlight);}
  .card p{margin:0; font-size:15px; color:var(--starlight-dim); line-height:1.5;}
  .meta{font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:0.09em; color:var(--amethyst); text-transform:uppercase; margin-bottom:5px;}
  .card-actions{display:flex; gap:14px; margin-top:10px; flex-wrap:wrap;}
  .icon-btn{background:none; border:none; color:var(--starlight-dim); font-family:'Jost',sans-serif; font-size:11.5px; letter-spacing:0.05em; cursor:pointer; padding:0; text-transform:uppercase;}
  .icon-btn:hover{color:var(--gold-light);}
  .icon-btn.danger:hover{color:var(--danger);}
  .clickable{cursor:pointer;}
  .clickable:hover{border-left-color:var(--rose);}

  .btn{font-family:'Jost',sans-serif; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; padding:12px 18px; border-radius:4px; cursor:pointer; width:100%;}
  .btn:active{transform:scale(0.98);}
  .btn-ghost{background:transparent; border:1px solid var(--gold); color:var(--gold-light);}
  .btn-ghost:hover{background:rgba(232,206,123,0.1);}
  .btn-solid{background:linear-gradient(180deg,var(--gold-light),var(--gold)); border:1px solid var(--gold); color:var(--void); font-weight:600;}
  .btn-solid:hover{filter:brightness(1.08);}
  .btn-solid:disabled{opacity:0.5; cursor:default;}

  label{display:block; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amethyst); margin:16px 0 6px;}
  input[type=text], textarea, select{width:100%; background:rgba(14,42,44,0.6); border:1px solid rgba(232,206,123,0.35); border-radius:4px; color:var(--starlight); font-family:'Cormorant Garamond',serif; font-size:16px; padding:10px 12px; outline:none;}
  input[type=text]:focus, textarea:focus, select:focus{border-color:var(--gold-light);}
  textarea{resize:vertical; min-height:70px;}
  select{appearance:none; -webkit-appearance:none;}
  .error{color:var(--danger); font-size:13px; font-family:'Jost',sans-serif; margin-top:6px; display:none;}

  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .chip{font-family:'Jost',sans-serif; font-size:12px; padding:7px 12px; border-radius:14px; border:1px solid rgba(232,206,123,0.35); color:var(--starlight-dim); cursor:pointer; background:transparent;}
  .chip.selected{background:rgba(47,143,134,0.3); border-color:var(--rose); color:var(--starlight);}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; margin-top:16px; gap:14px;}
  .toggle-row span{font-family:'Jost',sans-serif; font-size:13px; color:var(--starlight-dim);}
  .switch{position:relative; width:40px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:rgba(169,196,194,0.25); border-radius:22px; cursor:pointer; transition:0.2s;}
  .slider:before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--starlight); border-radius:50%; transition:0.2s;}
  .switch input:checked + .slider{background:var(--rose);}
  .switch input:checked + .slider:before{transform:translateX(18px);}

  .panel{margin-top:16px; padding:18px; background:rgba(14,42,44,0.5); border-radius:8px; border:1px solid rgba(232,206,123,0.2);}
  .row-2{display:flex; gap:10px; margin-top:16px;}

  .about-item{display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid rgba(232,206,123,0.15); font-size:16px; line-height:1.5;}
  .about-item span{flex:1;}
  .about-item .rm{background:none; border:none; color:var(--starlight-dim); font-family:'Jost',sans-serif; font-size:10.5px; cursor:pointer; text-transform:uppercase;}
  .about-item .rm:hover{color:var(--danger);}

  .loading{text-align:center; padding:36px 16px; color:var(--amethyst); font-style:italic; font-size:16px;}
  .reveal-card{margin-top:22px; padding:3px; background:linear-gradient(160deg,var(--gold-light),var(--gold),var(--rose)); border-radius:12px;}
  .reveal-inner{background:linear-gradient(170deg,#123638,var(--void)); border-radius:10px; padding:28px 22px 20px; text-align:center; border:1px solid rgba(232,206,123,0.4);}
  .reveal-glyph{color:var(--gold); font-size:19px; letter-spacing:0.5em; margin-bottom:14px;}
  .reveal-title{font-family:'Cinzel',serif; font-size:14px; letter-spacing:0.1em; color:var(--gold-light); text-transform:uppercase; margin:0 0 16px;}
  .reveal-story{font-style:italic; font-size:18px; line-height:1.75; color:var(--starlight); text-align:left; white-space:pre-wrap;}
  .reveal-footer{margin-top:18px; padding-top:12px; border-top:1px solid rgba(232,206,123,0.25); font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:0.08em; color:var(--starlight-dim); text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="wordmark">Visions</p>
    <div class="glyph-row">✦ ⟡ ☾ ✦</div>
    <div class="rule"></div>
    <p class="tagline">Draw a scene from what's coming</p>
  </header>

  <nav>
    <button class="tab active sans" data-tab="visions">Visions</button>
    <button class="tab sans" data-tab="wishes">Wishes</button>
    <button class="tab sans" data-tab="castmates">Castmates</button>
    <button class="tab sans" data-tab="about">About Kimi</button>
  </nav>

  <section id="tab-visions" class="active">
    <label for="v-saved">Load a saved wish <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
    <select id="v-saved">
      <option value="">Start from scratch</option>
    </select>

    <label for="v-wish">What you're calling in</label>
    <input type="text" id="v-wish" placeholder="Name the wish for this scene">
    <label for="v-desc">Any detail worth including <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
    <textarea id="v-desc" placeholder="What it looks or feels like when it's real"></textarea>

    <div class="toggle-row"><span>Save this wish for next time</span>
      <label class="switch"><input type="checkbox" id="v-remember"><span class="slider"></span></label></div>

    <label>Who's on stage <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
    <div class="chip-row" id="v-people"></div>

    <div class="toggle-row"><span>Weave in your chart</span>
      <label class="switch"><input type="checkbox" id="v-chart" checked><span class="slider"></span></label></div>
    <div class="toggle-row"><span>Use what's in About Kimi</span>
      <label class="switch"><input type="checkbox" id="v-about" checked><span class="slider"></span></label></div>

    <div class="row-2">
      <button class="btn btn-ghost sans" id="v-random" style="width:auto; flex:1;">\u2726 Surprise me</button>
      <button class="btn btn-solid" id="v-draw" style="flex:2;">Draw the vision</button>
    </div>
    <p class="error" id="v-error">Name what you're calling in first.</p>
    <div id="v-output"></div>

    <div class="section-head" style="margin-top:34px;">Past visions</div>
    <div id="v-archive"></div>
  </section>

  <section id="tab-wishes">
    <button class="btn btn-ghost sans" id="new-w-btn">+ New saved wish</button>
    <div class="panel" id="w-form" style="display:none;">
      <label for="w-title">Wish</label>
      <input type="text" id="w-title" placeholder="What you're calling in">
      <label for="w-desc">Detail <span style="text-transform:none; letter-spacing:0;">(optional)</span></label>
      <textarea id="w-desc" placeholder="What it looks or feels like when it's real"></textarea>
      <p class="error" id="w-error">Give it a title first.</p>
      <div class="row-2">
        <button class="btn btn-ghost sans" id="w-cancel">Cancel</button>
        <button class="btn btn-solid sans" id="w-save">Save wish</button>
      </div>
    </div>
    <div id="w-list" style="margin-top:16px;"></div>
  </section>

  <section id="tab-castmates">
    <button class="btn btn-ghost sans" id="new-cm-btn">+ New castmate</button>
    <div class="panel" id="cm-form" style="display:none;">
      <label for="cm-name">Name</label>
      <input type="text" id="cm-name" placeholder="Their name">
      <label for="cm-rel">Relationship</label>
      <input type="text" id="cm-rel" placeholder="How they matter to you">
      <label for="cm-notes">Notes</label>
      <textarea id="cm-notes" placeholder="Anything worth weaving in about them"></textarea>
      <p class="error" id="cm-error">Give them a name first.</p>
      <div class="row-2">
        <button class="btn btn-ghost sans" id="cm-cancel">Cancel</button>
        <button class="btn btn-solid sans" id="cm-save">Save castmate</button>
      </div>
    </div>
    <div id="cm-list" style="margin-top:16px;"></div>
  </section>

  <section id="tab-about">
    <div class="panel" style="margin-top:0;">
      <label for="a-cat">Category</label>
      <select id="a-cat">
        <option>Likes</option>
        <option>Dislikes</option>
        <option>Ambitions</option>
        <option>Brand</option>
        <option>Voice &amp; style</option>
        <option>Practices</option>
        <option>Notes</option>
      </select>
      <label for="a-text">What to record</label>
      <textarea id="a-text" placeholder="One thing about you"></textarea>
      <p class="error" id="a-error">Write something first.</p>
      <div style="margin-top:16px;"><button class="btn btn-solid sans" id="a-save">Add to profile</button></div>
    </div>
    <div id="about-list" style="margin-top:22px;"></div>
    <div class="section-head">Your chart</div>
    <textarea id="a-chart" style="min-height:100px;"></textarea>
    <button class="btn btn-ghost sans" id="a-chart-save" style="margin-top:10px;">Save chart</button>

    <div class="section-head">Favorite visions</div>
    <div id="a-favorites"></div>
  </section>
</div>

<script>
const SEED_CASTMATES=[
  {id:'seed-rachel', name:'Rachel', rel:'Close friend', notes:'Marrying Trevor in September; Kimi is Maid of Honor'},
  {id:'seed-kai', name:'Kai', rel:'Close friend', notes:'Part of the coven, with Kayla'},
  {id:'seed-kayla', name:'Kayla', rel:'Close friend', notes:'Part of the coven, with Kai'},
  {id:'seed-dad', name:'Dad', rel:'Father', notes:'Co-hosts a podcast with her'},
  {id:'seed-trevor', name:'Trevor', rel:"Rachel's groom", notes:'Marrying Rachel in September'}
];
const SEED_ABOUT=[
  {id:'sa1', cat:'Brand', text:'Aesthetic is maximalist and theatrical \u2014 Moulin Rouge!, The Fifth Element, Lady Gaga, Lilly Pulitzer, Monster High'},
  {id:'sa2', cat:'Practices', text:'Astrology, tarot, and folk magic as genuine interpretive frameworks'},
  {id:'sa3', cat:'Notes', text:'Poet, writer, performer, community builder based in Portland'},
  {id:'sa4', cat:'Brand', text:"Building Kimi's Costume Club, a creative events brand"}
];
const DEFAULT_CHART="Sun 17\u00b0 Taurus, Moon 17\u00b0 Capricorn, Ascendant 18\u00b0 Virgo, Mercury 27\u00b0 Taurus, Venus 25\u00b0 Gemini, Mars 3\u00b0 Taurus, Jupiter 17\u00b0 Capricorn, Saturn 3\u00b0 Aries, Uranus 4\u00b0 Aquarius, Neptune 27\u00b0 Capricorn, Pluto 2\u00b0 Sagittarius";
const GLYPHS=["\u2726 \u27e1 \u263e","\u2721 \u2726 \u2721","\u263c \u2727 \u263c","\u27e1 \u2606 \u27e1","\u2721 \u263e \u2721"];

let castmates=[], about=[], visions=[], savedWishes=[];
let chart=DEFAULT_CHART;
let vPeople=new Set(), editCm=null, editW=null;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
async function get(k){ try{ const v=localStorage.getItem('visions:'+k); return v; }catch(e){ return null; } }
async function put(k,v){ try{ localStorage.setItem('visions:'+k, v); }catch(e){} }

async function load(){
  const c=await get('castmates'); castmates=c?JSON.parse(c):null;
  const a=await get('about'); about=a?JSON.parse(a):null;
  const v=await get('visions'); visions=v?JSON.parse(v):[];
  const w=await get('saved-wishes'); savedWishes=w?JSON.parse(w):[];
  const ch=await get('chart'); chart=ch||DEFAULT_CHART;
  if(!castmates||!castmates.length){ castmates=SEED_CASTMATES.slice(); await put('castmates',JSON.stringify(castmates)); }
  if(!about||!about.length){ about=SEED_ABOUT.slice(); await put('about',JSON.stringify(about)); }
  if(!ch) await put('chart',chart);
  document.getElementById('a-chart').value=chart;
  renderAll();
}
const saveCastmates=()=>put('castmates',JSON.stringify(castmates));
const saveAbout=()=>put('about',JSON.stringify(about));
const saveVisions=()=>put('visions',JSON.stringify(visions));
const saveSavedWishes=()=>put('saved-wishes',JSON.stringify(savedWishes));

function renderAll(){ renderCastmates(); renderAbout(); renderPeopleChips(); renderVisionArchive(); renderSavedWishes(); renderSavedPicker(); renderFavorites(); }

function renderSavedPicker(){
  const sel=document.getElementById('v-saved');
  sel.innerHTML='<option value="">Start from scratch</option>'+savedWishes.map(w=>`<option value="${w.id}">${esc(w.title)}</option>`).join('');
}
document.getElementById('v-saved').addEventListener('change', ()=>{
  const id=document.getElementById('v-saved').value;
  if(!id){ document.getElementById('v-wish').value=''; document.getElementById('v-desc').value=''; return; }
  const w=savedWishes.find(x=>x.id===id);
  document.getElementById('v-wish').value=w.title;
  document.getElementById('v-desc').value=w.desc||'';
  document.getElementById('v-remember').checked=false;
});

function renderSavedWishes(){
  const list=document.getElementById('w-list');
  if(!savedWishes.length){ list.innerHTML='<div class="empty">No saved wishes yet. Add ones you\'ll draw on again and again.</div>'; return; }
  list.innerHTML=savedWishes.map(w=>`
    <div class="card">
      <h3>${esc(w.title)}</h3>
      ${w.desc?`<p>${esc(w.desc)}</p>`:''}
      <div class="card-actions">
        <button class="icon-btn sans" onclick="useSavedWish('${w.id}')">Draw this</button>
        <button class="icon-btn sans" onclick="startEditW('${w.id}')">Edit</button>
        <button class="icon-btn danger sans" onclick="delSavedWish('${w.id}')">Delete</button>
      </div>
    </div>`).join('');
}
function useSavedWish(id){
  const w=savedWishes.find(x=>x.id===id);
  goTab('visions');
  document.getElementById('v-saved').value=id;
  document.getElementById('v-wish').value=w.title;
  document.getElementById('v-desc').value=w.desc||'';
}
document.getElementById('new-w-btn').addEventListener('click',()=>{
  editW=null;
  document.getElementById('w-title').value='';
  document.getElementById('w-desc').value='';
  document.getElementById('w-error').style.display='none';
  document.getElementById('w-form').style.display='block';
});
document.getElementById('w-cancel').addEventListener('click',()=>{ document.getElementById('w-form').style.display='none'; });
document.getElementById('w-title').addEventListener('input',()=>{ document.getElementById('w-error').style.display='none'; });
document.getElementById('w-save').addEventListener('click', async ()=>{
  const title=document.getElementById('w-title').value.trim();
  if(!title){ document.getElementById('w-error').style.display='block'; return; }
  const desc=document.getElementById('w-desc').value.trim();
  if(editW){ const w=savedWishes.find(x=>x.id===editW); w.title=title; w.desc=desc; }
  else savedWishes.push({id:uid(), title, desc});
  await saveSavedWishes();
  document.getElementById('w-form').style.display='none';
  renderSavedWishes(); renderSavedPicker();
});
function startEditW(id){
  editW=id; const w=savedWishes.find(x=>x.id===id);
  document.getElementById('w-title').value=w.title;
  document.getElementById('w-desc').value=w.desc||'';
  document.getElementById('w-error').style.display='none';
  document.getElementById('w-form').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function delSavedWish(id){ savedWishes=savedWishes.filter(w=>w.id!==id); await saveSavedWishes(); renderSavedWishes(); renderSavedPicker(); }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>goTab(t.dataset.tab)));
function goTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tab[data-tab="'+name+'"]').classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderPeopleChips(){
  const row=document.getElementById('v-people');
  row.innerHTML=castmates.length?castmates.map(p=>`<button type="button" class="chip sans ${vPeople.has(p.id)?'selected':''}" data-pid="${p.id}">${esc(p.name)}</button>`).join('')
    :'<span style="color:var(--starlight-dim); font-size:13px; font-family:Jost,sans-serif;">Add castmates to include them.</span>';
  row.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    const id=c.dataset.pid;
    if(vPeople.has(id)) vPeople.delete(id); else vPeople.add(id);
    c.classList.toggle('selected');
  }));
}

function renderCastmates(){
  const list=document.getElementById('cm-list');
  if(!castmates.length){ list.innerHTML='<div class="empty">No castmates yet. Bring in the people who matter.</div>'; return; }
  list.innerHTML=castmates.map(p=>`
    <div class="card">
      ${p.rel?`<div class="meta">${esc(p.rel)}</div>`:''}
      <h3>${esc(p.name)}</h3>
      ${p.notes?`<p>${esc(p.notes)}</p>`:''}
      <div class="card-actions">
        <button class="icon-btn sans" onclick="startEditCm('${p.id}')">Edit</button>
        <button class="icon-btn danger sans" onclick="delCm('${p.id}')">Delete</button>
      </div>
    </div>`).join('');
}
document.getElementById('new-cm-btn').addEventListener('click',()=>{
  editCm=null;
  ['cm-name','cm-rel','cm-notes'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('cm-error').style.display='none';
  document.getElementById('cm-form').style.display='block';
});
document.getElementById('cm-cancel').addEventListener('click',()=>{ document.getElementById('cm-form').style.display='none'; });
document.getElementById('cm-name').addEventListener('input',()=>{ document.getElementById('cm-error').style.display='none'; });
document.getElementById('cm-save').addEventListener('click', async ()=>{
  const name=document.getElementById('cm-name').value.trim();
  if(!name){ document.getElementById('cm-error').style.display='block'; return; }
  const rel=document.getElementById('cm-rel').value.trim(), notes=document.getElementById('cm-notes').value.trim();
  if(editCm){ const p=castmates.find(x=>x.id===editCm); p.name=name; p.rel=rel; p.notes=notes; }
  else castmates.push({id:uid(), name, rel, notes});
  await saveCastmates();
  document.getElementById('cm-form').style.display='none';
  renderCastmates(); renderPeopleChips();
});
function startEditCm(id){
  editCm=id; const p=castmates.find(x=>x.id===id);
  document.getElementById('cm-name').value=p.name;
  document.getElementById('cm-rel').value=p.rel||'';
  document.getElementById('cm-notes').value=p.notes||'';
  document.getElementById('cm-error').style.display='none';
  document.getElementById('cm-form').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function delCm(id){ castmates=castmates.filter(p=>p.id!==id); vPeople.delete(id); await saveCastmates(); renderCastmates(); renderPeopleChips(); }

function renderAbout(){
  const list=document.getElementById('about-list');
  if(!about.length){ list.innerHTML='<div class="empty">Nothing recorded yet. Start with what you love.</div>'; return; }
  const cats=[...new Set(about.map(a=>a.cat))];
  list.innerHTML=cats.map(c=>`
    <div class="section-head">${esc(c)}</div>
    ${about.filter(a=>a.cat===c).map(a=>`
      <div class="about-item"><span>${esc(a.text)}</span><button class="rm" onclick="delAbout('${a.id}')">Remove</button></div>`).join('')}`).join('');
}
document.getElementById('a-save').addEventListener('click', async ()=>{
  const text=document.getElementById('a-text').value.trim();
  if(!text){ document.getElementById('a-error').style.display='block'; return; }
  document.getElementById('a-error').style.display='none';
  about.push({id:uid(), cat:document.getElementById('a-cat').value, text});
  await saveAbout();
  document.getElementById('a-text').value='';
  renderAbout();
});
document.getElementById('a-text').addEventListener('input',()=>{ document.getElementById('a-error').style.display='none'; });
async function delAbout(id){ about=about.filter(a=>a.id!==id); await saveAbout(); renderAbout(); }
document.getElementById('a-chart-save').addEventListener('click', async ()=>{
  chart=document.getElementById('a-chart').value.trim(); await put('chart',chart);
});

function renderVisionArchive(){
  const list=document.getElementById('v-archive');
  if(!visions.length){ list.innerHTML='<div class="empty">Nothing drawn yet.</div>'; return; }
  list.innerHTML=visions.slice().reverse().map(v=>`
    <div class="card clickable" onclick="showVision('${v.id}')">
      <div class="meta">${new Date(v.createdAt).toLocaleDateString()}${v.favorite?' \u00b7 \u2726 favorite':''}</div>
      <h3>${esc(v.wishTitle)}</h3>
      <p>${esc(v.story.slice(0,90))}\u2026</p>
    </div>`).join('');
}

function renderFavorites(){
  const list=document.getElementById('a-favorites');
  const favs=visions.filter(v=>v.favorite);
  if(!favs.length){ list.innerHTML='<div class="empty">No favorites marked yet. Star a vision to keep it here.</div>'; return; }
  list.innerHTML=favs.slice().reverse().map(v=>`
    <div class="card clickable" onclick="showVisionFrom('${v.id}')">
      <div class="meta">${new Date(v.createdAt).toLocaleDateString()}</div>
      <h3>${esc(v.wishTitle)}</h3>
      <p>${esc(v.story.slice(0,90))}\u2026</p>
    </div>`).join('');
}
function showVisionFrom(id){ goTab('visions'); showVisionObj(visions.find(v=>v.id===id)); }
async function toggleFavorite(id){
  const v=visions.find(x=>x.id===id);
  v.favorite=!v.favorite;
  await saveVisions();
  showVisionObj(v);
  renderVisionArchive(); renderFavorites();
}

document.getElementById('v-random').addEventListener('click', ()=>{
  if(!savedWishes.length){ document.getElementById('v-error').textContent='Save a wish first \u2014 nothing to draw from yet.'; document.getElementById('v-error').style.display='block'; return; }
  const w=savedWishes[Math.floor(Math.random()*savedWishes.length)];
  document.getElementById('v-saved').value=w.id;
  document.getElementById('v-wish').value=w.title;
  document.getElementById('v-desc').value=w.desc||'';
  document.getElementById('v-remember').checked=false;
  document.getElementById('v-draw').click();
});

document.getElementById('v-draw').addEventListener('click', async ()=>{
  const title=document.getElementById('v-wish').value.trim();
  if(!title){ document.getElementById('v-error').textContent='Name what you\'re calling in first.'; document.getElementById('v-error').style.display='block'; return; }
  document.getElementById('v-error').style.display='none';
  const desc=document.getElementById('v-desc').value.trim();
  if(document.getElementById('v-remember').checked){
    savedWishes.push({id:uid(), title, desc});
    await saveSavedWishes();
    renderSavedWishes(); renderSavedPicker();
    document.getElementById('v-remember').checked=false;
  }
  const chosen=castmates.filter(p=>vPeople.has(p.id));
  const useChart=document.getElementById('v-chart').checked;
  const useAbout=document.getElementById('v-about').checked;
  const btn=document.getElementById('v-draw'); btn.disabled=true;
  document.getElementById('v-output').innerHTML='<div class="loading">consulting the sky\u2026</div>';

  const peopleText=chosen.length?chosen.map(p=>`${p.name} (${p.rel||'important to her'}${p.notes?', '+p.notes:''})`).join('; '):'no one specific \u2014 keep it about her';
  const aboutText=useAbout&&about.length?about.map(a=>`${a.cat}: ${a.text}`).join('\n'):null;
  const chartText=useChart&&chart?chart:null;

  const system=`You write short second-person manifestation vignettes for a client named Kimi. Voice: warm, cinematic, theatrical, present or near-future tense, like a scene she is about to live. 3 short paragraphs, 180-260 words. No preamble, no title, no markdown \u2014 just the prose. Ground concrete sensory detail in the wish and people given. ${aboutText?"A profile of her tastes and world is provided \u2014 let it shape texture and detail, don't recite it.":""} ${chartText?"Lightly weave in one or two of the astrological placements, as flavor, not jargon.":"Do not mention astrology."} End on a grounded, hopeful image, not a cliffhanger.`;
  const user=`Wish: ${title}\nDetails: ${desc||'none given'}\nPeople: ${peopleText}\n${aboutText?'About her:\n'+aboutText+'\n':''}${chartText?'Her chart: '+chartText:''}`;

  try{
    const res=await fetch("https://hidden-moon-c0e1.schiefer-kimi.workers.dev/",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1000, system, messages:[{role:"user",content:user}]})
    });
    const data=await res.json();
    const story=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(!story) throw new Error('empty');
    const v={id:uid(), wishTitle:title, story, glyph:GLYPHS[Math.floor(Math.random()*GLYPHS.length)], people:chosen.map(p=>p.name), createdAt:Date.now()};
    visions.push(v);
    await saveVisions();
    renderVisionArchive();
    showVisionObj(v);
  }catch(err){
    document.getElementById('v-output').innerHTML='<div class="empty">The vision didn\'t come through. Try drawing again.</div>';
  }finally{ btn.disabled=false; }
});

function showVisionObj(v){
  document.getElementById('v-output').innerHTML=`
    <div class="reveal-card"><div class="reveal-inner">
      <div class="reveal-glyph">${v.glyph}</div>
      <p class="reveal-title">${esc(v.wishTitle)}</p>
      <div class="reveal-story">${esc(v.story)}</div>
      <div class="reveal-footer">${v.people.length?'with '+v.people.map(esc).join(', ')+' \u2014 ':''}${new Date(v.createdAt).toLocaleDateString()}</div>
    </div></div>
    <div class="row-2" style="margin-top:14px;">
      <button class="btn ${v.favorite?'btn-solid':'btn-ghost'} sans" onclick="toggleFavorite('${v.id}')">${v.favorite?'\u2726 Favorited':'Favorite this vision'}</button>
      <button class="btn btn-ghost sans" onclick="document.getElementById('v-output').innerHTML=''">Clear</button>
    </div>`;
}
function showVision(id){ goTab('visions'); showVisionObj(visions.find(v=>v.id===id)); }

load();
</script>
</body>
</html>
